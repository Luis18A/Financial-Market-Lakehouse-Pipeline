# ==============================================================================
# Financial Market Lakehouse Pipeline - Docker Compose
# Arquitectura Medallón: MinIO (S3) + Spark + PostgreSQL + Airflow
# ==============================================================================

networks:
  lakehouse_net:
    driver: bridge
    name: lakehouse_net

volumes:
  minio_data:
    driver: local
  postgres_data:
    driver: local

services:
  # ----------------------------------------------------------------------------
  # 1. MinIO: Object Storage compatible con S3 (Data Lake Medallón)
  # ----------------------------------------------------------------------------
  # 1. MinIO: Object Storage compatible con S3 (Data Lake Medallón)
  # ----------------------------------------------------------------------------
  minio:
    image: ${MINIO_IMAGE:-docker-minio:latest}
    build:
      context: ./docker/minio
      dockerfile: Dockerfile
    container_name: lakehouse_minio
    restart: unless-stopped
    ports:
      - "${MINIO_API_PORT:-9000}:9000"       # S3 API
      - "${MINIO_CONSOLE_PORT:-9001}:9001"   # Consola Web UI
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    networks:
      - lakehouse_net

  # ----------------------------------------------------------------------------
  # 2. PostgreSQL: Base interna para Airflow y Data Warehouse para dbt (Gold)
  # ----------------------------------------------------------------------------
  postgres:
    image: postgres:15-alpine
    container_name: postgres_lakehouse
    restart: unless-stopped
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgrespassword}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./sql/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    networks:
      - lakehouse_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ----------------------------------------------------------------------------
  # 3. Apache Spark (Master & Worker): Motor distribuido para capa Silver
  # ----------------------------------------------------------------------------
  spark-master:
    image: ${SPARK_IMAGE:-bitnamilegacy/spark:3.5.0}
    container_name: lakehouse_spark_master
    restart: unless-stopped
    environment:
      - SPARK_MODE=master
      - SPARK_RPC_AUTHENTICATION_ENABLED=no
      - SPARK_RPC_ENCRYPTION_ENABLED=no
      - SPARK_LOCAL_STORAGE_ENCRYPTION_ENABLED=no
      - SPARK_SSL_ENABLED=no
    entrypoint: >
      /bin/bash -c "
      python3 /opt/bitnami/spark/jobs/spark_server.py &
      /opt/bitnami/scripts/spark/entrypoint.sh /opt/bitnami/scripts/spark/run.sh
      "
    ports:
      - "${SPARK_MASTER_PORT:-7077}:7077"         # Spark Master URL
      - "${SPARK_MASTER_WEBUI_PORT:-8081}:8081"   # Spark Web UI
    volumes:
      - ./spark_jobs:/opt/bitnami/spark/jobs
      - ./config/spark-defaults.conf:/opt/bitnami/spark/conf/spark-defaults.conf:ro
    networks:
      - lakehouse_net

  spark-worker:
    image: ${SPARK_IMAGE:-bitnamilegacy/spark:3.5.0}
    container_name: lakehouse_spark_worker
    restart: unless-stopped
    depends_on:
      - spark-master
    environment:
      - SPARK_MODE=worker
      - SPARK_MASTER_URL=spark://spark-master:7077
      - SPARK_WORKER_MEMORY=${SPARK_WORKER_MEMORY:-1G}
      - SPARK_WORKER_CORES=${SPARK_WORKER_CORES:-1}
      - SPARK_RPC_AUTHENTICATION_ENABLED=no
      - SPARK_RPC_ENCRYPTION_ENABLED=no
      - SPARK_LOCAL_STORAGE_ENCRYPTION_ENABLED=no
      - SPARK_SSL_ENABLED=no
    ports:
      - "${SPARK_WORKER_WEBUI_PORT:-8082}:8082"   # Spark Worker Web UI
    volumes:
      - ./spark_jobs:/opt/bitnami/spark/jobs
      - ./config/spark-defaults.conf:/opt/bitnami/spark/conf/spark-defaults.conf:ro
    networks:
      - lakehouse_net

  # ----------------------------------------------------------------------------
  # 4. Apache Airflow: Orquestador del Pipeline End-to-End
  # ----------------------------------------------------------------------------
  airflow-webserver:
    image: ${AIRFLOW_IMAGE:-apache/airflow:2.8.1-python3.11}
    container_name: lakehouse_airflow
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_started
      spark-master:
        condition: service_started
    ports:
      - "${AIRFLOW_PORT:-8080}:8080"
    environment:
      - AIRFLOW__CORE__EXECUTOR=${AIRFLOW__CORE__EXECUTOR:-LocalExecutor}
      - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=postgresql+psycopg2://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgrespassword}@postgres:5432/${AIRFLOW_DB:-airflow}
      - AIRFLOW__CORE__LOAD_EXAMPLES=${AIRFLOW__CORE__LOAD_EXAMPLES:-False}
      - _AIRFLOW_WWW_USER_CREATE=true
      - _AIRFLOW_WWW_USER_USERNAME=${AIRFLOW_ADMIN_USER:-admin}
      - _AIRFLOW_WWW_USER_PASSWORD=${AIRFLOW_ADMIN_PASSWORD:-admin}
      - _PIP_ADDITIONAL_REQUIREMENTS=minio requests pandas pyarrow python-dotenv psycopg2-binary
      # Credenciales y endpoints de MinIO (S3 Compatible)
      - AWS_ACCESS_KEY_ID=${MINIO_ROOT_USER:-minioadmin}
      - AWS_SECRET_ACCESS_KEY=${MINIO_ROOT_PASSWORD:-minioadmin}
      - AWS_ENDPOINT_URL=http://minio:9000
      - AWS_DEFAULT_REGION=us-east-1
      - S3_ENDPOINT=minio:9000
      - DESTINATION__FILESYSTEM__BUCKET_URL=s3://${BUCKET_BRONZE:-bronze}
      - DESTINATION__FILESYSTEM__CREDENTIALS__AWS_ACCESS_KEY_ID=${MINIO_ROOT_USER:-minioadmin}
      - DESTINATION__FILESYSTEM__CREDENTIALS__AWS_SECRET_ACCESS_KEY=${MINIO_ROOT_PASSWORD:-minioadmin}
      - DESTINATION__FILESYSTEM__CREDENTIALS__ENDPOINT_URL=http://minio:9000
      # Variables de configuración del negocio y Spark
      - ALPHA_VANTAGE_API_KEY=${ALPHA_VANTAGE_API_KEY}
      - SPARK_MASTER_URL=spark://spark-master:7077
    volumes:
      - ./dags:/opt/airflow/dags
      - ./spark_jobs:/opt/airflow/spark_jobs
      - ./dbt_financial:/opt/airflow/dbt_financial
      - ./logs:/opt/airflow/logs
      - ./config:/opt/airflow/config
    command: airflow standalone
    networks:
      - lakehouse_net
